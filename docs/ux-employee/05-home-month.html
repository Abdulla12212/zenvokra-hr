<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Cloudesh · Home · September</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="shared.css" />
  </head>
  <body>
    <div class="app">
      <aside class="sidebar" id="sidebar"></aside>
      <div class="stage">
        <header class="topbar">
          <div class="topbar-meta">Thu 20 Aug 2026 · Dhaka HQ</div>
          <div class="row">
            <div class="btn">Request time off</div>
            <div class="icon-btn">
              <svg viewBox="0 0 24 24"><path d="M6 16h12l-1.2-2V10a4.8 4.8 0 0 0-9.6 0v4z"/><path d="M10 16a2 2 0 0 0 4 0"/></svg>
              <span class="ping"></span>
            </div>
          </div>
        </header>
        <main class="main">
          <div class="page-head">
            <div>
              <h1>Home</h1>
              <p>In 09:02 · out by 18:00</p>
            </div>
            <span class="badge badge-ok">In</span>
          </div>
          <div class="grid-main">
            <div class="card card-p-sm">
              <div class="cal-head">
                <div class="cal-nav">
                  <div class="btn btn-outline btn-icon">‹</div>
                  <h2>September 2026</h2>
                  <div class="btn btn-outline btn-icon is-quiet">›</div>
                </div>
                <div class="row">
                  <div class="legend">
                    <span><i class="dot dot-ok"></i> Present</span>
                    <span><i class="dot dot-warn"></i> Late</span>
                    <span><i class="dot dot-off"></i> Off</span>
                    <span><i class="dot dot-holiday"></i> Closed</span>
                  </div>
                  <div class="btn btn-sm">Today</div>
                </div>
              </div>
              <div class="cal-grid" id="cal"></div>
            </div>
            <div class="card card-p">
              <div class="tiny">Sat 5 Sep</div>
              <div style="font-weight: 600; margin: 4px 0 8px">Company Day</div>
              <span class="badge">Closed</span>
              <dl class="dl" style="grid-template-columns: 1fr 1fr; margin-top: 16px">
                <dt>Type</dt>
                <dd>Acme Consulting</dd>
                <dt>Pay</dt>
                <dd>Paid</dd>
                <dt>Leave</dt>
                <dd>Not deducted</dd>
              </dl>
            </div>
          </div>
        </main>
      </div>
    </div>
    <script src="shell.js"></script>
    <script>
      Cloudesh.mount("home");
      Cloudesh.month("cal", { month: "september", selected: 5 });
    </script>
  </body>
</html>
