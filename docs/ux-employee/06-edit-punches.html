<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Cloudesh · Edit punches</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="shared.css" />
  </head>
  <body>
    <div class="app">
      <aside class="sidebar" id="sidebar"></aside>
      <div class="stage">
        <header class="topbar">
          <div class="topbar-meta">Thu 20 Aug 2026 · Dhaka HQ</div>
          <div class="icon-btn">
            <svg viewBox="0 0 24 24"><path d="M6 16h12l-1.2-2V10a4.8 4.8 0 0 0-9.6 0v4z"/><path d="M10 16a2 2 0 0 0 4 0"/></svg>
            <span class="ping"></span>
          </div>
        </header>
        <main class="main">
          <div class="page-head">
            <div>
              <h1>Edit punches</h1>
              <p>Wed 19 Aug · saves now. No approval.</p>
            </div>
          </div>

          <div class="card card-p" style="max-width: 520px">
            <div class="stack">
              <div class="grid-2">
                <div class="field">
                  <div class="label">In</div>
                  <div class="control is-focus">09:00</div>
                </div>
                <div class="field">
                  <div class="label">Out</div>
                  <div class="control">18:05</div>
                </div>
              </div>
              <div class="grid-2">
                <div class="field">
                  <div class="label">Break start</div>
                  <div class="control">12:15</div>
                </div>
                <div class="field">
                  <div class="label">Break end</div>
                  <div class="control">13:05</div>
                </div>
              </div>
              <div class="field">
                <div class="label">Note <span class="tiny">optional</span></div>
                <div class="control textarea">In was 09:00. Punch missed.</div>
              </div>
              <div class="row">
                <div class="btn">Save</div>
                <div class="btn btn-ghost">Cancel</div>
              </div>
            </div>
          </div>
        </main>
      </div>
    </div>
    <script src="shell.js"></script>
    <script>
      Cloudesh.mount("home");
    </script>
  </body>
</html>
