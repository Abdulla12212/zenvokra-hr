<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Cloudesh · Inbox</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="shared.css" />
  </head>
  <body>
    <div class="app">
      <aside class="sidebar" id="sidebar"></aside>
      <div class="stage">
        <header class="topbar">
          <div class="topbar-meta">Thu 20 Aug 2026 · Dhaka HQ</div>
          <div class="icon-btn">
            <svg viewBox="0 0 24 24"><path d="M6 16h12l-1.2-2V10a4.8 4.8 0 0 0-9.6 0v4z"/><path d="M10 16a2 2 0 0 0 4 0"/></svg>
          </div>
        </header>
        <main class="main">
          <div class="page-head">
            <h1>Inbox</h1>
          </div>
          <div class="card">
            <div class="list-row">
              <span class="badge badge-warn">Leave</span>
              <div style="flex: 1">
                <div style="font-weight: 500">25–26 Aug waiting on Nadia</div>
                <div class="tiny">Sent today 09:41</div>
              </div>
              <div class="btn btn-ghost btn-sm">Open</div>
            </div>
            <div class="list-row">
              <span class="badge badge-warn">Punch</span>
              <div style="flex: 1">
                <div style="font-weight: 500">19 Aug marked late</div>
                <div class="tiny">Today 08:12</div>
              </div>
              <div class="btn btn-outline btn-sm">Edit</div>
            </div>
            <div class="list-row">
              <span class="badge badge-ok">In</span>
              <div style="flex: 1">
                <div style="font-weight: 500">Checked in 09:02</div>
                <div class="tiny">Dhaka HQ</div>
              </div>
            </div>
            <div class="list-row">
              <span class="badge">Holiday</span>
              <div style="flex: 1">
                <div style="font-weight: 500">Office closed 5 Sep</div>
                <div class="tiny">Company Day · paid · not leave</div>
              </div>
              <div class="btn btn-ghost btn-sm">Show on calendar</div>
            </div>
          </div>
        </main>
      </div>
    </div>
    <script src="shell.js"></script>
    <script>
      Cloudesh.mount("inbox");
    </script>
  </body>
</html>
