<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Cloudesh · Help</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="shared.css" />
  </head>
  <body>
    <div class="app">

      <div class="stage">
        <header class="topbar">
          <div class="topbar-meta">Thu 20 Aug 2026 · Asia/Dhaka</div>

          <div class="search" style="margin-bottom: 16px">Search</div>
          <div class="grid-2">

            <div class="card card-p">
              <div style="font-weight: 600; margin-bottom: 8px">People Ops</div>

              <div class="btn">Email</div>
            </div>
          </div>
        </main>
      </div>
    </div>
    <script src="shell.js"></script>
    <script>
      Cloudesh.mount();
    </script>
