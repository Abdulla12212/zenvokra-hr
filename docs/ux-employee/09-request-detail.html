<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Cloudesh · Request</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="shared.css" />
  </head>
  <body>
    <div class="app">
      <aside class="sidebar" id="sidebar"></aside>
      <div class="stage">
        <header class="topbar">
          <div class="topbar-meta">Thu 20 Aug 2026 · Dhaka HQ</div>
          <div class="icon-btn">
            <svg viewBox="0 0 24 24"><path d="M6 16h12l-1.2-2V10a4.8 4.8 0 0 0-9.6 0v4z"/><path d="M10 16a2 2 0 0 0 4 0"/></svg>
            <span class="ping"></span>
          </div>
        </header>
        <main class="main">
          <div class="page-head">
            <div>
              <h1>25–26 Aug</h1>
              <p>Annual · 2 days</p>
            </div>
            <span class="badge badge-warn">Pending · Nadia</span>
          </div>

          <div class="card card-p" style="max-width: 560px">
            <dl class="dl">
              <dt>Type</dt>
              <dd>Annual</dd>
              <dt>Dates</dt>
              <dd>Tue 25 – Wed 26 Aug 2026</dd>
              <dt>After approval</dt>
              <dd>10 annual days left</dd>
              <dt>Note</dt>
              <dd>Family visit.</dd>
            </dl>
            <div style="margin: 24px 0 8px; font-weight: 600; font-size: 13px">Activity</div>
            <p style="font-size: 14px">Sent 20 Aug, 09:41</p>
            <p class="tiny" style="margin-top: 4px">Waiting on Nadia Chowdhury</p>
            <div class="row" style="margin-top: 24px">
              <div class="btn btn-destructive">Cancel request</div>
            </div>
          </div>
        </main>
      </div>
    </div>
    <script src="shell.js"></script>
    <script>
      Cloudesh.mount("leave");
    </script>
  </body>
</html>
