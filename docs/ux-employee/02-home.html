<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Cloudesh · Home</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="shared.css" />
  </head>
  <body>
    <div class="app">
      <aside class="sidebar" id="sidebar"></aside>
      <div class="stage">
        <header class="topbar">
          <div class="topbar-meta">Thu 20 Aug 2026 · Dhaka HQ</div>
          <div class="row">
            <div class="btn">Request time off</div>
            <div class="icon-btn">
              <svg viewBox="0 0 24 24"><path d="M6 16h12l-1.2-2V10a4.8 4.8 0 0 0-9.6 0v4z"/><path d="M10 16a2 2 0 0 0 4 0"/></svg>
              <span class="ping"></span>
            </div>
          </div>
        </header>
        <main class="main">
          <div class="page-head">
            <div>
              <h1>Home</h1>
              <p>In 09:02 · out by 18:00</p>
            </div>
            <span class="badge badge-ok">In</span>
          </div>

          <div class="alert" style="margin-bottom: 16px">
            <span><span class="dot dot-warn"></span> &nbsp;19 Aug marked late</span>
            <div class="btn btn-outline btn-sm">Edit</div>
          </div>

          <div class="grid-main">
            <div class="card card-p-sm">
              <div class="cal-head">
                <div class="cal-nav">
                  <div class="btn btn-outline btn-icon is-quiet">‹</div>
                  <h2>August 2026</h2>
                  <div class="btn btn-outline btn-icon">›</div>
                </div>
                <div class="row">
                  <div class="legend">
                    <span><i class="dot dot-ok"></i> Present</span>
                    <span><i class="dot dot-warn"></i> Late</span>
                    <span><i class="dot dot-off"></i> Off</span>
                    <span><i class="dot dot-holiday"></i> Closed</span>
                  </div>
                  <div class="btn btn-outline btn-sm is-quiet">Today</div>
                </div>
              </div>
              <div class="cal-grid" id="cal"></div>
            </div>
            <div class="stack">
              <div class="card card-p-sm">
                <div class="tiny">Thu 20 Aug</div>
                <div style="font-weight: 600; margin: 4px 0 12px">This shift</div>
                <div class="dl" style="grid-template-columns: 1fr 1fr">
                  <dt>In</dt>
                  <dd style="color: var(--success)">09:02</dd>
                  <dt>Break</dt>
                  <dd>12:15–13:05</dd>
                  <dt>Now</dt>
                  <dd>16:32</dd>
                  <dt>Expected out</dt>
                  <dd>18:00</dd>
                </div>
                <div class="btn" style="width: 100%; margin-top: 16px">Punch out</div>
              </div>
              <div class="kpis" style="flex-direction: column">
                <div>
                  <div class="n" style="color: var(--success)">6h 32m</div>
                  <div class="k">Worked</div>
                </div>
                <div>
                  <div class="n">50m</div>
                  <div class="k">Break</div>
                </div>
              </div>
            </div>
          </div>
        </main>
      </div>
    </div>
    <script src="shell.js"></script>
    <script>
      Cloudesh.mount("home");
      Cloudesh.month("cal", { selected: 20 });
    </script>
  </body>
</html>
