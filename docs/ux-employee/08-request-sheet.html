<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Zenvokra · Request from calendar</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="shared.css" />
  </head>
  <body>
    <div class="app">
      <aside class="sidebar" id="sidebar"></aside>
      <div class="stage">
        <header class="topbar">
          <div class="topbar-meta">Thu 20 Aug 2026 · Dhaka HQ</div>
          <div class="icon-btn">
            <svg viewBox="0 0 24 24"><path d="M6 16h12l-1.2-2V10a4.8 4.8 0 0 0-9.6 0v4z"/><path d="M10 16a2 2 0 0 0 4 0"/></svg>
            <span class="ping"></span>
          </div>
        </header>
        <div class="split">
          <main class="main">
            <div class="page-head">
              <h1>Home</h1>
            </div>
            <div class="card card-p-sm">
              <div class="cal-head">
                <div class="cal-nav">
                  <div class="btn btn-outline btn-icon is-quiet">‹</div>
                  <h2>August 2026</h2>
                  <div class="btn btn-outline btn-icon">›</div>
                </div>
                <div class="btn btn-outline btn-sm is-quiet">Today</div>
              </div>
              <div class="cal-grid" id="cal"></div>
            </div>
          </main>
          <aside class="sheet">
            <div class="row" style="justify-content: space-between">
              <div style="font-weight: 600">Request time off</div>
              <span class="tiny">Close</span>
            </div>
            <div class="field">
              <div class="label">Type</div>
              <div class="control is-focus">Annual</div>
            </div>
            <div class="field">
              <div class="label">From</div>
              <div class="control">Tue 25 Aug 2026</div>
            </div>
            <div class="field">
              <div class="label">To</div>
              <div class="control">Wed 26 Aug 2026</div>
            </div>
            <div class="field">
              <div class="label">Working days</div>
              <div class="control readonly">2 · 10 left after</div>
            </div>
            <div class="field">
              <div class="label">Note</div>
              <div class="control textarea" style="min-height: 64px">Family visit.</div>
            </div>
            <div class="btn" style="width: 100%">Send</div>
            <div class="btn btn-ghost" style="width: 100%">Cancel</div>
          </aside>
        </div>
      </div>
    </div>
    <script src="shell.js"></script>
    <script>
      Zenvokra.mount("home");
      Zenvokra.month("cal", { selected: 25, range: [25, 26] });
    </script>
  </body>
</html>
