<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Cloudesh · Continue</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="shared.css" />
  </head>
  <body>
    <div class="welcome">
      <div class="welcome-card" style="width: 460px">
        <div class="row" style="gap: 8px">
          <div class="brand-mark">C</div>
          <div>
            <div class="brand-name">Cloudesh</div>
            <div class="tiny">Acme Consulting</div>
          </div>
        </div>
        <h1>Continue</h1>
        <p class="tiny" style="margin: -12px 0 16px">Session stub. Same tenant, two personas. No passwords.</p>
        <div class="stack" style="gap: 10px">
          <div class="row" style="gap: 12px; padding: 12px; border: 1px solid var(--border); border-radius: var(--radius)">
            <img class="avatar lg" src="assets/mushroom-avatar.svg" alt="" />
            <div style="flex: 1">
              <strong style="font-weight: 500">Akram Hossain</strong>
              <span class="tiny" style="display: block">EMP-1024 · Engineering · Employee app</span>
            </div>
            <div class="btn">Continue</div>
          </div>
          <div class="row" style="gap: 12px; padding: 12px; border: 1px solid var(--primary); border-radius: var(--radius); background: color-mix(in oklch, var(--primary) 6%, white)">
            <div class="avatar-initials lg">AH</div>
            <div style="flex: 1">
              <strong style="font-weight: 500">Akram Hossain</strong>
              <span class="tiny" style="display: block">Admin · Dhaka HQ · Organization</span>
            </div>
            <div class="btn">Open admin</div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
